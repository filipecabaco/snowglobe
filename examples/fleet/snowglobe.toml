# Live data on one machine, shown by another over the network. `snowglobe daemon --detach`, then
# `snowglobe apply` here, and open http://127.0.0.1:8080. `snowglobe diff` says what apply would do,
# `snowglobe down` removes it all, and `snowglobe top` shows it running. The same file runs in a
# browser tab at /fleet/ on the demo site.
#
# db (Supabase) gets a new row in public.ticks every second. viewer (node) subscribes to that table
# with supabase-js over Supabase Realtime (a WebSocket) at supabase.internal:54321, keeps the last 40
# rows and draws them on a page of its own. The link is the only way between them: neither can reach
# anything else.
name = "live-data"

[templates.supabase]
build = "../supabase"
network = "fetch"

# Node, with supabase-js in /root/app
[templates.node]
build = "../web"
network = "fetch"

# The database, set up once: the table, published to Realtime, and a row a second from a loop
[snapshots.db]
template = "supabase"
# Each command has a time limit of its own (timeout), so a slow one on a phone is cut off and named
# rather than using up the step
run = [
{ timeout = "2m", cmd = '''
. /home/supa/.stack-env
# A slow machine (a phone) can still be starting the database: wait for it, up to 90s, and if it never
# answers say what is there, so the failure explains itself (psql exits 2 when it can't connect)
n=0
until psql -tA "$DB_URL" -c 'select 1' >/dev/null 2>&1; do
  n=$((n + 1))
  if [ "$n" -gt 90 ]; then
    echo "postgres did not answer in 90s. DB_URL=${DB_URL:-<unset>}"
    ls -l /home/supa/.stack-env 2>&1
    echo "postgres processes: $(ps | grep -c '[p]ostgres')"
    free -m 2>&1 | head -n 2
    dmesg 2>/dev/null | tail -n 5
    psql "$DB_URL" -c 'select 1' 2>&1 | tail -n 3
    exit 2
  fi
  sleep 1
done
echo "postgres answered after ${n}s"
  ''' },
# Each statement a command of its own, so a slow or stuck one is named in the log. lock_timeout: a
# statement waiting on another's lock (Realtime's, say) fails after 60s and says so, rather than
# using up the whole step
{ timeout = "90s", cmd = '''
. /home/supa/.stack-env
PGOPTIONS='-c lock_timeout=60s' psql -q -v ON_ERROR_STOP=1 "$DB_URL" \
  -c 'create table if not exists public.ticks (id bigserial primary key, v numeric not null, at timestamptz not null default now())' \
  -c 'grant select on public.ticks to anon, authenticated' && echo "table ready"
  ''' },
{ timeout = "90s", cmd = '''
. /home/supa/.stack-env
# Realtime streams the table's inserts. Added once: a second run of this step finds it there already
if psql -tA "$DB_URL" -c "select 1 from pg_publication_tables where pubname = 'supabase_realtime' and tablename = 'ticks'" | grep -q 1; then
  echo "already published to Realtime"
else
  PGOPTIONS='-c lock_timeout=60s' psql -q -v ON_ERROR_STOP=1 "$DB_URL" -c 'alter publication supabase_realtime add table public.ticks' &&
    echo "published to Realtime"
fi
  ''' },
{ timeout = "30s", cmd = '''
. /home/supa/.stack-env; (while true; do psql -q "$DB_URL" -c "insert into public.ticks (v) values (round((random() * 10 + 100)::numeric, 2))"; sleep 1; done >/dev/null 2>&1 &)
  ''' },
]
ready = ". /home/supa/.stack-env; psql -tA \"$DB_URL\" -c 'select count(*) from public.ticks' | grep -q '^[1-9]'"
timeout = "4m"

# The viewer, set up once: it loads the last rows, subscribes, and serves what it has heard. Three
# commands with a time limit each: writing it, starting it, and waiting in the machine until it
# listens (Node loading supabase-js takes a while on a phone), so a slow start is waited for there,
# in one command, and one that never comes says what Node printed
[snapshots.viewer]
template = "node"
run = [
{ timeout = "30s", cmd = '''
cat > /root/app/viewer.mjs <<'EOF'
import http from 'node:http';
import { createClient } from '@supabase/supabase-js';
const sb = createClient('http://supabase.internal:54321', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0');
let ticks = [];
let status = 'connecting';
const keep = (row) => { ticks = [...ticks.filter((t) => t.id !== row.id), row].sort((a, b) => a.id - b.id).slice(-40); };
async function load() {
  const { data } = await sb.from('ticks').select('id,v').order('id', { ascending: false }).limit(40);
  for (const row of data ?? []) keep(row);
}
sb.channel('ticks')
  .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'ticks' }, (p) => keep(p.new))
  .subscribe((s) => { status = s; if (s === 'SUBSCRIBED') load().catch(() => {}); });
http.createServer((req, res) => {
  if (req.url === '/health') return res.end('ok');
  const ys = ticks.map((t) => Number(t.v));
  const lo = Math.min(...ys), hi = Math.max(...ys);
  const pts = ys.map((y, i) => `${i * 10},${58 - ((y - lo) / (hi - lo || 1)) * 56}`).join(' ');
  res.setHeader('content-type', 'text/html');
  res.end(`<meta http-equiv='refresh' content='1'><body style='font:16px/1.5 system-ui;margin:24px'><h3>Live data, over Supabase Realtime</h3><p style='font-size:32px;margin:0'>${ys.at(-1) ?? '...'}</p><svg width='400' height='60'><polyline fill='none' stroke='#d6300c' stroke-width='2' points='${pts}'/></svg><p><small>${status}: pushed by Supabase at supabase.internal:54321, a machine of its own</small></p>`);
}).listen(8080, '0.0.0.0');
EOF
echo "viewer.mjs written"
  ''' },
{ timeout = "30s", cmd = '''
cd /root/app && (node viewer.mjs >/tmp/viewer.log 2>&1 &) && echo "node started"
  ''' },
{ timeout = "2m", cmd = '''
# Until it answers on 8080, up to 110s, saying how long it is taking every 10s
n=0
until wget -q -O /dev/null http://127.0.0.1:8080/health 2>/dev/null; do
  n=$((n + 1))
  if [ "$n" -gt 110 ]; then
    echo "the viewer did not listen in 110s; what Node printed:"
    tail -n 20 /tmp/viewer.log
    exit 1
  fi
  [ $((n % 10)) -eq 0 ] && echo "still starting after ${n}s"
  sleep 1
done
echo "listening after ${n}s"
  ''' },
]
ready = "wget -q -O /dev/null http://127.0.0.1:8080/health"
timeout = "30s"

[templates.db]
snapshot = "db"

[templates.viewer]
snapshot = "viewer"

# The database: one machine, up
[machines.db]
template = "db"

# The viewer, behind localhost:8080, scaled to zero: its first request wakes it
[services.viewer]
template = "viewer"
ports = ["8080:8080"]
min = 0
max = 1
idle = "5m"

# The viewer reaches the database's API gateway (REST and Realtime) as supabase.internal:54321: a
# port other than 80 and 443, which a page turns into HTTP; anything else is a plain TCP stream
[links.viewer-db]
from = "viewer"
to = "db"
port = 54321
as = "supabase.internal"
