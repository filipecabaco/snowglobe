# Live data from Supabase, shown by a second machine over a link. `snowglobe daemon --detach`, then
# `snowglobe apply` here, and open http://127.0.0.1:8080. `snowglobe diff` says what apply would do,
# `snowglobe down` removes it all, and `snowglobe top` shows it running. The same file runs in a
# browser tab at /fleet/ on the demo site, phones included: the viewer is kept small, so most of what
# the tab can hold goes to Supabase.
#
# db (Supabase) gets a new row in public.ticks every second, from one Bun process: the Bun inside the
# Supabase CLI (BUN_BE_BUN=1), so nothing is installed for it, inserting over the Data API on one
# connection (no psql started each second). viewer (the web machine) subscribes to that table over
# Supabase Realtime at supabase.internal:54321, through the link, the only way between the two. It is
# one small Node server with no dependencies: Node's own WebSocket speaks Realtime, fetch reads the
# last rows, and the rows go to your browser as a stream (server-sent events). The page is Preact and
# htm, a few KB, no build step. The web machine's own Vite watcher is stopped: the viewer needs none.
#
# Both have a health check: the database's passes while rows keep coming, the viewer's while it is
# subscribed. Each is healed by starting its process again.
name = "live-data"

[templates.supabase]
build = "../supabase"
network = "fetch"

# Node (the web machine: Node and npm, its React project unused here)
[templates.node]
build = "../web"
network = "fetch"

# The database, set up once: the table, published to Realtime, and the Bun process that adds a row a second
[snapshots.db]
template = "supabase"
# Each command has a time limit of its own (timeout), so a slow one on a phone is cut off and named
# rather than using up the step
run = [
{ timeout = "2m", cmd = '''
. /home/supa/.stack-env
# A slow machine (a phone) can still be starting the database: wait for it, up to 90s, and if it never
# answers say what is there, so the failure explains itself (psql exits 2 when it can't connect)
n=0
until psql -tA "$DB_URL" -c 'select 1' >/dev/null 2>&1; do
  n=$((n + 1))
  if [ "$n" -gt 90 ]; then
    echo "postgres did not answer in 90s. DB_URL=${DB_URL:-<unset>}"
    ls -l /home/supa/.stack-env 2>&1
    echo "postgres processes: $(ps | grep -c '[p]ostgres')"
    free -m 2>&1 | head -n 2
    dmesg 2>/dev/null | tail -n 5
    psql "$DB_URL" -c 'select 1' 2>&1 | tail -n 3
    exit 2
  fi
  sleep 1
done
echo "postgres answered after ${n}s"
  ''' },
# Each statement a command of its own, so a slow or stuck one is named in the log. lock_timeout: a
# statement waiting on another's lock (Realtime's, say) fails after 60s and says so, rather than
# using up the whole step
{ timeout = "90s", cmd = '''
. /home/supa/.stack-env
PGOPTIONS='-c lock_timeout=60s' psql -q -v ON_ERROR_STOP=1 "$DB_URL" \
  -c 'create table if not exists public.ticks (id bigserial primary key, v numeric not null, at timestamptz not null default now())' \
  -c 'grant select on public.ticks to anon, authenticated' && echo "table ready"
  ''' },
{ timeout = "90s", cmd = '''
. /home/supa/.stack-env
# Realtime streams the table's inserts. Added once: a second run of this step finds it there already
if psql -tA "$DB_URL" -c "select 1 from pg_publication_tables where pubname = 'supabase_realtime' and tablename = 'ticks'" | grep -q 1; then
  echo "already published to Realtime"
else
  PGOPTIONS='-c lock_timeout=60s' psql -q -v ON_ERROR_STOP=1 "$DB_URL" -c 'alter publication supabase_realtime add table public.ticks' &&
    echo "published to Realtime"
fi
  ''' },
{ timeout = "60s", cmd = '''
mkdir -p /root/rows
# A row a second over the Data API, and /healthz on 8080: 200 only if a row went in within 5s
cat > /root/rows/rows.ts <<'EOF'
const { API_URL, SERVICE_ROLE_KEY } = process.env;
const headers = { apikey: SERVICE_ROLE_KEY!, authorization: `Bearer ${SERVICE_ROLE_KEY}`, "content-type": "application/json", prefer: "return=minimal" };
let lastRow = 0;
let lastError = "no row yet";
async function tick() {
  try {
    const v = Math.round((Math.random() * 10 + 100) * 100) / 100;
    const r = await fetch(`${API_URL}/rest/v1/ticks`, { method: "POST", headers, body: JSON.stringify({ v }) });
    if (r.ok) lastRow = Date.now();
    else lastError = `HTTP ${r.status}: ${(await r.text()).slice(0, 200)}`;
  } catch (e) {
    lastError = String(e);
  }
}
setInterval(tick, 1000);
tick();
Bun.serve({
  port: 8080,
  hostname: "0.0.0.0",
  fetch() {
    const ok = Date.now() - lastRow < 5000;
    return new Response(ok ? "ok\n" : `no row in 5s: ${lastError}\n`, { status: ok ? 200 : 503 });
  },
});
EOF
# Started here, and again by the health check's heal: the one running is ended by its pid (a pattern
# would match the shell that wrote this file too)
cat > /root/rows/start.sh <<'EOF'
#!/bin/sh
. /home/supa/.stack-env
[ -f /tmp/rows.pid ] && kill "$(cat /tmp/rows.pid)" 2>/dev/null
cd /root/rows && (BUN_BE_BUN=1 nohup supabase run /root/rows/rows.ts >/tmp/rows.log 2>&1 & echo $! > /tmp/rows.pid)
EOF
chmod +x /root/rows/start.sh
/root/rows/start.sh
echo "a row a second, from one Bun process"
  ''' },
]
ready = "curl -sf -o /dev/null http://127.0.0.1:8080/healthz"
timeout = "4m"

# The viewer, set up once: Preact and htm fetched, the web machine's Vite watcher stopped, and the
# server written and started. It isn't subscribed yet (the link comes after): it keeps trying, and
# its health check waits for it
[snapshots.viewer]
template = "node"
run = [
# Through the web machine's npm relay (its serve process), before that is stopped: pinned, two small
# packages with no dependencies of their own
{ timeout = "3m", cmd = '''
mkdir -p /root/viewer && cd /root/viewer &&
  printf '{ "name": "viewer", "private": true, "type": "module" }\n' > package.json &&
  npm install --no-audit --no-fund --save-exact preact@11.2.0 htm@3.1.1 >/tmp/npm.log 2>&1 &&
  echo "preact and htm installed" || { tail -n 20 /tmp/npm.log; exit 1; }
  ''' },
# The web machine builds its React project at boot and watches it (serve --watch: Vite, in Node). The
# viewer needs none of it: stopped, its memory is Supabase's. [h]: not this shell's own command line
{ timeout = "30s", cmd = '''
pkill -f 'serve --watc[h]' && echo "the Vite watcher is stopped" || echo "no Vite watcher was running"
  ''' },
{ timeout = "30s", cmd = '''
cat > /root/viewer/index.html <<'EOF'
<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live data</title>
<body style="font:16px/1.5 system-ui;margin:24px">
<script type="importmap">{ "imports": { "preact": "./preact.js", "preact/hooks": "./hooks.js", "htm": "./htm.js" } }</script>
<script type="module">
import { h, render } from "preact";
import { useEffect, useState } from "preact/hooks";
import htm from "htm";
const html = htm.bind(h);
// What the viewer has heard, pushed to this page as it hears it (server-sent events, relative to the
// page: under the fleet page's frame too)
function Live() {
  const [s, set] = useState({ ticks: [], status: "connecting" });
  useEffect(() => {
    const events = new EventSource("events");
    events.onmessage = (e) => set(JSON.parse(e.data));
    return () => events.close();
  }, []);
  const ys = s.ticks.map((t) => t.v);
  const lo = Math.min(...ys), hi = Math.max(...ys);
  const points = ys.map((y, i) => `${i * 10},${58 - ((y - lo) / (hi - lo || 1)) * 56}`).join(" ");
  return html`
    <h3>Live data, over Supabase Realtime</h3>
    <p style="font-size:32px;margin:0">${ys.length ? ys.at(-1) : "..."}</p>
    <svg viewBox="0 0 390 60" preserveAspectRatio="none" style="width:100%;max-width:400px;height:60px">
      <polyline points=${points} fill="none" stroke="#d6300c" stroke-width="2" vector-effect="non-scaling-stroke" />
    </svg>
    <p><small>${s.status}: heard by the viewer from supabase.internal:54321, a machine of its own</small></p>`;
}
render(html`<${Live} />`, document.body);
</script>
EOF
cat > /root/viewer/viewer.mjs <<'EOF'
// The viewer: Supabase Realtime's protocol (Phoenix channels, JSON) over Node's own WebSocket, the
// last rows over the Data API, and the page with what it has heard, pushed as server-sent events
import http from "node:http";
import { readFileSync } from "node:fs";
import { fileURLToPath } from "node:url";
const API = "supabase.internal:54321";
const KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0";
let ticks = [];
let status = "connecting";
const listeners = new Set();
const say = () => {
  const msg = `data: ${JSON.stringify({ ticks, status })}\n\n`;
  for (const res of listeners) res.write(msg);
};
const keep = (row) => {
  if (!row || row.id == null) return;
  ticks = [...ticks.filter((t) => t.id !== row.id), { id: row.id, v: Number(row.v) }].sort((a, b) => a.id - b.id).slice(-40);
  say();
};
async function load() {
  const r = await fetch(`http://${API}/rest/v1/ticks?select=id,v&order=id.desc&limit=40`, { headers: { apikey: KEY, authorization: `Bearer ${KEY}` } });
  if (r.ok) for (const row of await r.json()) keep(row);
}
// Joined again from the start whenever the socket closes; each join reloads the last rows
function connect() {
  const ws = new WebSocket(`ws://${API}/realtime/v1/websocket?apikey=${KEY}&vsn=1.0.0`);
  let ref = 0;
  let beat = null;
  const send = (topic, event, payload) => ws.send(JSON.stringify({ topic, event, payload, ref: String(++ref), join_ref: topic === "phoenix" ? null : "1" }));
  ws.onopen = () => {
    send("realtime:ticks", "phx_join", { config: { broadcast: { self: false }, presence: { key: "" }, postgres_changes: [{ event: "INSERT", schema: "public", table: "ticks" }] }, access_token: KEY });
    beat = setInterval(() => send("phoenix", "heartbeat", {}), 25000);
  };
  ws.onmessage = (e) => {
    const m = JSON.parse(e.data);
    if (m.event === "phx_reply" && m.ref === "1") {
      status = m.payload?.status === "ok" ? "SUBSCRIBED" : `refused: ${JSON.stringify(m.payload?.response ?? m.payload)}`;
      say();
      if (status === "SUBSCRIBED") load().catch(() => {});
    } else if (m.event === "postgres_changes") {
      keep(m.payload?.data?.record ?? m.payload?.record);
    }
  };
  ws.onerror = () => {};
  ws.onclose = () => {
    clearInterval(beat);
    if (status === "SUBSCRIBED") { status = "reconnecting"; say(); }
    setTimeout(connect, 2000);
  };
}
connect();
// The page and its three modules, read once
const file = (spec) => readFileSync(fileURLToPath(import.meta.resolve(spec)));
const files = {
  "/": ["text/html; charset=utf-8", readFileSync("/root/viewer/index.html")],
  "/preact.js": ["text/javascript", file("preact")],
  "/hooks.js": ["text/javascript", file("preact/hooks")],
  "/htm.js": ["text/javascript", file("htm")],
};
http.createServer((req, res) => {
  const path = new URL(req.url, "http://viewer").pathname;
  // Healthy once subscribed; /up says only that it listens
  if (path === "/health") return res.writeHead(status === "SUBSCRIBED" ? 200 : 503).end(`${status}\n`);
  if (path === "/up") return res.end("up\n");
  if (path === "/events") {
    res.writeHead(200, { "content-type": "text/event-stream", "cache-control": "no-store" });
    listeners.add(res);
    res.write(`data: ${JSON.stringify({ ticks, status })}\n\n`);
    return req.on("close", () => listeners.delete(res));
  }
  const [type, body] = files[path] ?? files["/"];
  res.writeHead(200, { "content-type": type, "cache-control": "no-store" }).end(body);
}).listen(8080, "0.0.0.0");
EOF
cat > /root/viewer/start.sh <<'EOF'
#!/bin/sh
[ -f /tmp/viewer.pid ] && kill "$(cat /tmp/viewer.pid)" 2>/dev/null
cd /root/viewer && (nohup node viewer.mjs >/tmp/viewer.log 2>&1 & echo $! > /tmp/viewer.pid)
EOF
chmod +x /root/viewer/start.sh
/root/viewer/start.sh
# Until it listens, up to 50s, and if it never does, what Node printed
n=0
until wget -q -T 2 -O /dev/null http://127.0.0.1:8080/up 2>/dev/null; do
  n=$((n + 1))
  if [ "$n" -ge 50 ]; then echo "the viewer did not listen in 50s; what Node printed:"; tail -n 20 /tmp/viewer.log; exit 1; fi
  sleep 1
done
echo "the viewer listens on 8080"
  ''' },
]
ready = "wget -q -O /dev/null http://127.0.0.1:8080/up"
timeout = "30s"

[templates.db]
snapshot = "db"

[templates.viewer]
snapshot = "viewer"

# The database: one machine, up. Its check passes while rows keep coming; failing, the Bun process is
# started again (a machine heals by a hook or not at all)
[machines.db]
template = "db"

[machines.db.health]
interval = "10s"
grace = "60s"
heal = "hook"
heal_cmd = "/root/rows/start.sh"

[machines.db.health.http]
port = 8080
path = "/healthz"

# The viewer, behind localhost:8080, scaled to zero: its first request wakes it
[services.viewer]
template = "viewer"
ports = ["8080:8080"]
min = 0
max = 1
idle = "5m"

# Healthy once subscribed (the link and the database up); failing, the viewer is started again, then
# (still failing) replaced
[services.viewer.health]
interval = "10s"
grace = "90s"
heal = "hook"
heal_cmd = "/root/viewer/start.sh"

[services.viewer.health.http]
port = 8080
path = "/health"

# The viewer reaches the database's API gateway (REST and Realtime) as supabase.internal:54321: a
# port other than 80 and 443, which a page turns into HTTP; anything else is a plain TCP stream
[links.viewer-db]
from = "viewer"
to = "db"
port = 54321
as = "supabase.internal"
