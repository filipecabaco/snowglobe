# Live data from Supabase, in one machine. `snowglobe daemon --detach`, then `snowglobe apply` here,
# and open http://127.0.0.1:8080. `snowglobe diff` says what apply would do, `snowglobe down` removes
# it all, and `snowglobe top` shows it running. The same file runs in a browser tab at /fleet/ on the
# demo site, and that one fits a phone: a single machine is awake, not two.
#
# db (Supabase) gets a new row in public.ticks every second and serves a small page on 8080, both from
# one Bun process: the Bun inside the Supabase CLI (BUN_BE_BUN=1), so nothing is installed for it. It
# inserts over the Data API on one connection (no psql started each second) and serves the page with
# Bun.serve (no shell started for each request). The page runs in your browser: it reads the last 40
# rows over the REST API, subscribes to the table over Supabase Realtime (a WebSocket), both on the
# machine's port 54321, and draws them. The browser is the viewer, so no second machine runs beside
# the database. /healthz answers 200 only if a row went in within 5s: the service's health check, healed
# by starting the Bun process again.
name = "live-data"

[templates.supabase]
build = "../supabase"
network = "fetch"

# The database, set up once: the table, published to Realtime, and the Bun process (rows and the page)
[snapshots.db]
template = "supabase"
# Each command has a time limit of its own (timeout), so a slow one on a phone is cut off and named
# rather than using up the step
run = [
{ timeout = "2m", cmd = '''
. /home/supa/.stack-env
# A slow machine (a phone) can still be starting the database: wait for it, up to 90s, and if it never
# answers say what is there, so the failure explains itself (psql exits 2 when it can't connect)
n=0
until psql -tA "$DB_URL" -c 'select 1' >/dev/null 2>&1; do
  n=$((n + 1))
  if [ "$n" -gt 90 ]; then
    echo "postgres did not answer in 90s. DB_URL=${DB_URL:-<unset>}"
    ls -l /home/supa/.stack-env 2>&1
    echo "postgres processes: $(ps | grep -c '[p]ostgres')"
    free -m 2>&1 | head -n 2
    dmesg 2>/dev/null | tail -n 5
    psql "$DB_URL" -c 'select 1' 2>&1 | tail -n 3
    exit 2
  fi
  sleep 1
done
echo "postgres answered after ${n}s"
  ''' },
# Each statement a command of its own, so a slow or stuck one is named in the log. lock_timeout: a
# statement waiting on another's lock (Realtime's, say) fails after 60s and says so, rather than
# using up the whole step
{ timeout = "90s", cmd = '''
. /home/supa/.stack-env
PGOPTIONS='-c lock_timeout=60s' psql -q -v ON_ERROR_STOP=1 "$DB_URL" \
  -c 'create table if not exists public.ticks (id bigserial primary key, v numeric not null, at timestamptz not null default now())' \
  -c 'grant select on public.ticks to anon, authenticated' && echo "table ready"
  ''' },
{ timeout = "90s", cmd = '''
. /home/supa/.stack-env
# Realtime streams the table's inserts. Added once: a second run of this step finds it there already
if psql -tA "$DB_URL" -c "select 1 from pg_publication_tables where pubname = 'supabase_realtime' and tablename = 'ticks'" | grep -q 1; then
  echo "already published to Realtime"
else
  PGOPTIONS='-c lock_timeout=60s' psql -q -v ON_ERROR_STOP=1 "$DB_URL" -c 'alter publication supabase_realtime add table public.ticks' &&
    echo "published to Realtime"
fi
  ''' },
{ timeout = "60s", cmd = '''
mkdir -p /root/live
cat > /root/live/index.html <<'EOF'
<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live data</title>
<body style="font:16px/1.5 system-ui;margin:24px">
<h3>Live data, over Supabase Realtime</h3>
<p id="v" style="font-size:32px;margin:0">...</p>
<svg viewBox="0 0 390 60" preserveAspectRatio="none" style="width:100%;max-width:400px;height:60px"><polyline id="line" fill="none" stroke="#d6300c" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>
<p><small><span id="s">connecting</span>: pushed by Supabase over its Realtime WebSocket, straight to this page</small></p>
<script>
const KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0';
// Where the API is: in the fleet page's frame, port 54321 of this same machine, beside the port
// this page came from (preview/<machine>/54321/); natively, port 54321 of this host
const at = location.pathname.match(/^(.*\/preview\/[^/]+\/)\d+\//);
const api = at ? new URL(at[1] + '54321/', location.href) : new URL(location.protocol + '//' + location.hostname + ':54321/');
const $ = (id) => document.getElementById(id);
let ticks = [];
function draw() {
  const ys = ticks.map((t) => Number(t.v));
  const lo = Math.min(...ys), hi = Math.max(...ys);
  $('v').textContent = ys.length ? ys.at(-1) : '...';
  $('line').setAttribute('points', ys.map((y, i) => `${i * 10},${58 - ((y - lo) / (hi - lo || 1)) * 56}`).join(' '));
}
function keep(row) {
  if (!row || row.id == null) return;
  ticks = [...ticks.filter((t) => t.id !== row.id), row].sort((a, b) => a.id - b.id).slice(-40);
  draw();
}
async function load() {
  const r = await fetch(new URL('rest/v1/ticks?select=id,v&order=id.desc&limit=40', api), { headers: { apikey: KEY, authorization: 'Bearer ' + KEY } });
  if (r.ok) for (const row of await r.json()) keep(row);
}
// Supabase Realtime's protocol (Phoenix channels, JSON) by hand: join a channel for the table's
// inserts, a heartbeat every 25s, and again from the start if the socket closes (a phone that put
// the tab away, say). Each join reloads the last rows, so nothing missed meanwhile is a gap
function connect() {
  const u = new URL('realtime/v1/websocket?apikey=' + KEY + '&vsn=1.0.0', api);
  u.protocol = u.protocol === 'https:' ? 'wss:' : 'ws:';
  const ws = new WebSocket(u);
  let ref = 0, beat = null;
  const send = (topic, event, payload) => ws.send(JSON.stringify({ topic, event, payload, ref: String(++ref), join_ref: topic === 'phoenix' ? null : '1' }));
  ws.onopen = () => {
    $('s').textContent = 'joining';
    send('realtime:ticks', 'phx_join', { config: { broadcast: { self: false }, presence: { key: '' }, postgres_changes: [{ event: 'INSERT', schema: 'public', table: 'ticks' }] }, access_token: KEY });
    beat = setInterval(() => send('phoenix', 'heartbeat', {}), 25000);
  };
  ws.onmessage = (e) => {
    const m = JSON.parse(e.data);
    if (m.event === 'phx_reply' && m.ref === '1') {
      const ok = m.payload?.status === 'ok';
      $('s').textContent = ok ? 'SUBSCRIBED' : 'refused: ' + JSON.stringify(m.payload?.response ?? m.payload);
      if (ok) load().catch(() => {});
    } else if (m.event === 'postgres_changes') {
      keep(m.payload?.data?.record ?? m.payload?.record);
    }
  };
  ws.onclose = () => {
    clearInterval(beat);
    $('s').textContent = 'reconnecting';
    setTimeout(connect, 2000);
  };
}
connect();
</script>
EOF
# One Bun process does the rest: a row a second over the Data API (one connection, kept open), the
# page on 8080 for every path, and /healthz, 200 only if a row went in within 5s. The Bun is the one
# inside the Supabase CLI (BUN_BE_BUN=1), already in the machine and read in by its first start
cat > /root/live/server.ts <<'EOF'
const { API_URL, SERVICE_ROLE_KEY } = process.env;
const page = Bun.file("/root/live/index.html");
const headers = { apikey: SERVICE_ROLE_KEY!, authorization: `Bearer ${SERVICE_ROLE_KEY}`, "content-type": "application/json", prefer: "return=minimal" };
let lastRow = 0;
let lastError = "no row yet";
async function tick() {
  try {
    const v = Math.round((Math.random() * 10 + 100) * 100) / 100;
    const r = await fetch(`${API_URL}/rest/v1/ticks`, { method: "POST", headers, body: JSON.stringify({ v }) });
    if (r.ok) lastRow = Date.now();
    else lastError = `HTTP ${r.status}: ${(await r.text()).slice(0, 200)}`;
  } catch (e) {
    lastError = String(e);
  }
}
setInterval(tick, 1000);
tick();
Bun.serve({
  port: 8080,
  hostname: "0.0.0.0",
  fetch(req) {
    if (new URL(req.url).pathname.endsWith("/healthz")) {
      const ok = Date.now() - lastRow < 5000;
      return new Response(ok ? "ok\n" : `no row in 5s: ${lastError}\n`, { status: ok ? 200 : 503 });
    }
    return new Response(page, { headers: { "content-type": "text/html; charset=utf-8", "cache-control": "no-store" } });
  },
});
console.log("serving on 8080");
EOF
# Started here, and again by the health check's heal (it ends one already running first)
cat > /root/live/start.sh <<'EOF'
#!/bin/sh
. /home/supa/.stack-env
# By its pid: a pattern would match the shell that wrote this file too
[ -f /tmp/live.pid ] && kill "$(cat /tmp/live.pid)" 2>/dev/null
cd /root/live && (BUN_BE_BUN=1 nohup supabase run /root/live/server.ts >/tmp/live.log 2>&1 & echo $! > /tmp/live.pid)
EOF
chmod +x /root/live/start.sh
/root/live/start.sh
echo "the rows and the page: one Bun process, on 8080"
  ''' },
]
ready = "curl -sf -o /dev/null http://127.0.0.1:8080/healthz"
timeout = "4m"

[templates.db]
snapshot = "db"

# The page on 8080, and the API it calls on 54321. On the fleet page only the first port is framed,
# and the page reaches 54321 through the frame (preview/<machine>/54321/), so that is enough there
[services.live]
template = "db"
ports = ["8080:8080", "54321:54321"]

# Checked every 10s: a row in the last 5s, and the page answering. Failing 3 in a row, its heal command
# starts the Bun process again; failing again after that, natively the replica is replaced, and on the
# fleet page the machine starts from its image and runs its steps again
[services.live.health]
interval = "10s"
grace = "60s"
heal = "hook"
heal_cmd = "/root/live/start.sh"

[services.live.health.http]
port = 8080
path = "/healthz"
