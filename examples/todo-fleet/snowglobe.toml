# A todo app and its database, each a machine of its own: `snowglobe daemon --detach`, then
# `snowglobe apply` here, and open http://127.0.0.1:8080. `snowglobe down` removes it all.
#
# The app reaches Postgres as db.internal:5432 through a link: nothing else joins them, and
# neither machine has a way out of its own (egress is none by default). Start another instance
# (in `snowglobe ui`, Fleets, or POST /v1/fleets/todo/instances) and it gets an app and a
# database of its own, which the first one's can't reach.
name = "todo"

[network]
mode = "exclusive"      # each instance keeps to itself

# Postgres, with the todos table made when the image was built
[templates.db]
build = "db"
network = "fetch"       # a network device: for the link's connections and the service's port

# Elixir: Francis for HTTP, Ecto and Postgrex for the database
[templates.app]
build = "app"
network = "fetch"
# The image's snapshot holds the app already running: the same process, so the same random state
# (Erlang's :crypto, Ecto's ids), in every machine of it. Each machine starts its own instead
start = [{ timeout = "2m", cmd = '''
pkill -f beam.smp
while pgrep -f beam.smp >/dev/null; do sleep 0.1; done
/app/bin/todo daemon
until wget -q -O /dev/null http://127.0.0.1:4000/ 2>/dev/null; do sleep 0.2; done
''' }]

# One database machine: its data lives in its memory, so it stays up
[services.db]
template = "db"
ports = ["15432:5432"]
min = 1
max = 1

# The app behind localhost:8080
[services.app]
template = "app"
ports = ["8080:4000"]
min = 1
max = 2
concurrency = 50

# Each app machine answers GET / with a 2xx or 3xx, or it is swapped for a fresh one (by the
# supervisor below, which a supervised service heals by). A check on /
# rather than /todos: a database that is down is one problem, not a reason to replace every app
# machine
[services.app.health]
interval = "10s"
failures = 3
heal = "replace"

[services.app.health.http]
port = 4000
path = "/"

# The app's machines reach the database's as db.internal:5432
[links.app-db]
from = "app"
to = "db"
port = 5432
as = "db.internal"

# The database first, then the app that uses it: if the database's machine ends, it starts again
# and so does the app (rest_for_one), with fresh connections; an app replica that fails its check
# is replaced on its own. More than 3 restarts in a minute and the supervisor stops trying
# (degraded) until `snowglobe supervisor restart app-stack`
[supervisors.app-stack]
strategy = "rest_for_one"
children = ["db", "app"]
