<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fleets in a page · snowglobe</title>
  <link rel="canonical" href="https://filipecabaco.github.io/snowglobe/fleet/">
  <link rel="alternate" type="text/plain" href="../llms.txt" title="snowglobe for agents">
  <meta name="description" content="Run a snowglobe.toml in one browser tab: its snapshots set up, its services opened in a frame, its machines woken, all in Web Workers with no server.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="snowglobe">
  <meta property="og:title" content="Fleets in a page · snowglobe">
  <meta property="og:description" content="A fleet file, run in your browser tab: Linux machines in Web Workers, a service opened in a frame. No server.">
  <meta property="og:url" content="https://filipecabaco.github.io/snowglobe/fleet/">
  <meta property="og:image" content="https://filipecabaco.github.io/snowglobe/og.png">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%230d0d0d'/%3E%3Ccircle cx='8' cy='8' r='3.2' fill='%23d6300c'/%3E%3C/svg%3E">
  <link rel="preload" href="../fonts/Switzer-Variable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="../base.css">
  <script>
    // Apply a remembered theme before first paint, so the page never flashes the wrong one
    try { const t = localStorage.getItem("snowglobe-theme"); if (t === "dark" || t === "light") document.documentElement.dataset.theme = t; } catch {}
  </script>
  <style>
    [hidden] { display: none !important; }
    .wrap { max-width: 1400px; }
    .top { padding: 18px 0; }
    :root { --ease: cubic-bezier(.2,.8,.2,1); }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; font: 550 15px/1 var(--sans); height: 44px; padding: 0 18px; border-radius: 999px;
      cursor: pointer; border: 1px solid var(--ink); background: transparent; color: var(--ink); text-decoration: none; white-space: nowrap;
      transition: background-color .2s var(--ease), color .2s var(--ease), border-color .2s var(--ease); }
    .btn.go { background: var(--signal); border-color: var(--signal); color: var(--on-signal); }
    .btn:not(:disabled):hover { background: var(--ink); border-color: var(--ink); color: var(--bg); }
    .btn:disabled { opacity: .38; cursor: default; }
    .btn.sm { height: 34px; padding: 0 14px; font-size: 14px; }
    .link { font: inherit; color: var(--ink); background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; }
    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; box-sizing: border-box; border: 1.5px solid var(--ink-2); flex: none; }
    .dot[data-on="live"] { background: var(--signal); border-color: var(--signal); animation: live 1.2s infinite; }
    .dot[data-on="ok"] { background: var(--ink); border-color: var(--ink); }
    @keyframes live { 50% { opacity: .35; } }

    .head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 32px; padding: 16px 0 6px; }
    h1 { margin: 0; font-size: 26px; line-height: 1.1; letter-spacing: -.025em; font-weight: 620; }
    h2 { margin: 0 0 10px; font-size: 15px; font-weight: 620; letter-spacing: -.005em; }
    .lede { max-width: 70ch; margin: 0 0 14px; color: var(--ink-2); }
    #fleet-status { margin: 0 0 12px; min-height: 1.4em; color: var(--ink-2); }

    .cols { display: grid; grid-template-columns: minmax(300px, 5fr) minmax(0, 6fr); border-top: 1px solid var(--ink); border-bottom: 1px solid var(--ink); }
    .col { padding: 18px 22px 22px 0; min-width: 0; }
    .col + .col { padding: 18px 0 22px 22px; border-left: 1px solid var(--rule); }
    .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; margin: 0 0 10px; }
    .bar .grow { flex: 1; }
    textarea { display: block; width: 100%; min-height: 420px; resize: vertical; box-sizing: border-box; padding: 12px 14px; font: 13px/1.5 var(--mono, ui-monospace, monospace);
      color: var(--ink); background: transparent; border: 1px solid var(--rule); border-radius: 8px; tab-size: 2; }
    textarea:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
    textarea[readonly] { opacity: .6; }

    ol.steps, ul.plain { margin: 0; padding: 0; list-style: none; }
    ol.steps > li { padding: 12px 0; border-top: 1px solid var(--rule); }
    ol.steps > li:first-child { border-top: 0; padding-top: 0; }
    .step-head { display: flex; align-items: center; gap: 10px; }
    .step-head .step-sum { flex: 1; color: var(--ink-2); min-width: 0; }
    .step-state { margin: 6px 0 0 18px; color: var(--ink-2); font-size: 14px; }
    .step-state.bad { color: var(--signal); }
    .step-out { margin: 6px 0 0 18px; padding: 8px 10px; max-height: 180px; overflow: auto; font: 12px/1.45 var(--mono, ui-monospace, monospace); border: 1px solid var(--rule); border-radius: 6px; white-space: pre-wrap; }
    .problems { margin: 0 0 14px; padding: 10px 14px; border: 1px solid var(--signal); border-radius: 8px; }
    .problems li { margin: 2px 0; }
    .sub { margin-top: 22px; }
    .sub li { margin: 3px 0; color: var(--ink-2); font-size: 14px; }
    summary { cursor: pointer; font-weight: 620; font-size: 15px; margin-bottom: 8px; }
    summary span { color: var(--ink-2); font-weight: 400; }
    code { font: 13px var(--mono, ui-monospace, monospace); }

    .frame-box { margin-top: 22px; border: 1px solid var(--ink); border-radius: 8px; overflow: hidden; }
    .frame-box header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 12px; border-bottom: 1px solid var(--rule); }
    .frame-box iframe { display: block; width: 100%; height: 320px; border: 0; background: #fff; }
    @media (max-width: 900px) {
      .cols { grid-template-columns: minmax(0, 1fr); }
      .col, .col + .col { padding: 18px 0; border-left: 0; }
      .col + .col { border-top: 1px solid var(--rule); }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="top">
      <a class="mark" href="../">snowglobe<i aria-hidden="true"></i></a>
      <nav aria-label="Site">
        <a href="../#runs">Runs</a>
        <a href="../agent/">Agents</a>
        <a href="./" aria-current="page">Fleets</a>
        <a href="../docs/">Docs</a>
        <a href="https://github.com/filipecabaco/snowglobe">GitHub</a>
        <button class="theme" type="button" id="theme-toggle" aria-label="Switch to dark theme">Dark</button>
      </nav>
    </header>

    <main>
      <div class="head"><h1>Fleets in a page</h1></div>
      <p class="lede">A <code>snowglobe.toml</code>, run in this tab. The same file runs natively with <code>snowglobe apply</code>. <a href="../docs/orchestration/#fleet-page">Docs</a></p>
      <p id="fleet-status" role="status" aria-live="polite">Loading…</p>

      <div class="cols">
        <section class="col" aria-labelledby="file-title">
          <div class="bar">
            <h2 id="file-title" class="grow">File</h2>
            <button type="button" class="link" id="fleet-example">Load the example</button>
            <label class="link">Open a file<input type="file" id="fleet-file" accept=".toml,text/plain" hidden></label>
          </div>
          <textarea id="fleet-text" spellcheck="false" aria-labelledby="file-title" autocapitalize="off" autocomplete="off"></textarea>
        </section>

        <section class="col" aria-labelledby="plan-title">
          <div class="bar">
            <h2 id="plan-title" class="grow">Plan <span id="fleet-name"></span></h2>
            <button type="button" class="btn go sm" id="fleet-run-all" disabled>Run all</button>
          </div>
          <ul id="fleet-problems" class="plain problems" hidden></ul>
          <p id="fleet-plan-empty" class="lede" hidden></p>
          <ol id="fleet-steps" class="steps"></ol>

          <details class="sub" id="fleet-notes-box" hidden>
            <summary>Not applied here <span id="fleet-notes-count"></span></summary>
            <ul id="fleet-notes" class="plain"></ul>
          </details>

          <div class="sub">
            <h2>Machines</h2>
            <ul id="fleet-machines" class="plain"></ul>
          </div>

          <div class="frame-box" id="fleet-frame-box" hidden>
            <header><b id="fleet-frame-title"></b><button type="button" class="link" id="fleet-frame-close">Close</button></header>
            <iframe id="fleet-frame" title="A service of the fleet"></iframe>
          </div>
        </section>
      </div>
    </main>

    <footer>
      <span><a href="https://github.com/filipecabaco/snowglobe">snowglobe</a> · <a href="../llms.txt">llms.txt</a></span>
      <span><a href="../">Back to the runs</a></span>
    </footer>
  </div>

  <script src="../theme.js"></script>
  <script src="sessions.js"></script>
  <script src="agent.js"></script>
  <script src="machine.js"></script>
  <script src="transfer.js"></script>
  <script src="ws-client.js"></script>
  <script src="machine-core.js"></script>
  <script src="machine-host.js"></script>
  <script src="preview.js"></script>
  <script src="inspect.js"></script>
  <script src="builder.js"></script>
  <script src="scheduler.js"></script>
  <script src="orchestrator.js"></script>
  <script src="fleet.js"></script>
  <script src="fleet-page.js"></script>
</body>
</html>
