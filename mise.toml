[tools]
go = "1.27.1"

[env]
# <example>-<n>cpu: examples/<example> built with --cpus <n>; supabase-1cpu is what its X card plays
# python-agent is the agent page's python (a network for pip install); the index page doesn't list it
DEMOS = "supabase supabase-1cpu iex postgres elixir python python-agent typescript go rust java curl duckdb web"
# Examples built and checked in CI but not on the site (too big, or need the host's network)
EXAMPLES = "apk"

[tasks.build]
description = "Build every example into dist/<language>, then assemble the site"
run = '''
set -e
go build -o snowglobe ./cmd/snowglobe
rm -rf dist
for demo in $DEMOS; do
  case "$demo" in
    *-[0-9]cpu) n=${demo##*-}; ./snowglobe build "examples/${demo%-*}" --out "dist/$demo" --cpus "${n%cpu}" ;;
    *) ./snowglobe build "examples/$demo" --out "dist/$demo" ;;
  esac
done
mise run assemble
'''

# CI builds each demo in its own job, gathers them into dist/, and runs this same task, so the
# site the Pages workflow publishes is assembled exactly as `mise run build` assembles it locally
[tasks.assemble]
description = "Pool the blobs of the demos in dist/, make each an installable app, list the agent page's machines, and add the index page"
run = '''
set -e
go build -o snowglobe ./cmd/snowglobe
./snowglobe pool dist
# Every demo is also an installable app that works offline once it has run
for demo in $DEMOS; do
  ./snowglobe pwa "dist/$demo"
done
# The agent page's machines (/agent/runtimes.json and its scripts), once the sites' pages are final
./snowglobe agent-pages dist
# The index page, its font, and a copy of xterm.js it renders the recorded transcripts with
cp -R site/. dist/
cp -R dist/elixir/xterm dist/xterm
'''

[tasks.serve]
description = "Serve dist/ locally at http://localhost:8000"
run = "go run ./cmd/snowglobe serve dist"

[tasks.test]
description = "Run the tests"
run = "go test ./... && node --test internal/site/sessions.test.cjs internal/site/agent.test.cjs internal/site/machine.test.cjs internal/site/session-ui.test.cjs internal/site/scheduler.test.cjs internal/site/transfer.test.cjs internal/site/orchestrator.test.cjs internal/site/preview.test.cjs internal/site/builder.test.cjs bench/lib.test.mjs bench/server.test.mjs"
