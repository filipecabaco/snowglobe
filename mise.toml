[tools]
go = "1.27.1"

[env]
# <example>-<n>cpu: examples/<example> built with --cpus <n>. supabase-1cpu and conduit-1cpu are what
# the index page runs (one CPU starts in the page, with no window of its own) and supabase-1cpu what
# its X card plays; supabase and conduit, on two, are the agent page's
# <example>-nokernel: examples/<example> built with --kernel none (its program with no guest kernel)
# python-agent is the agent page's python (a network for pip install); the index page doesn't list it
DEMOS = "conduit conduit-1cpu supabase supabase-1cpu iex postgres elixir python python-agent typescript go rust java curl duckdb web bun"
# A demo runs its program with no guest kernel (--kernel none: a smaller snapshot, a faster start,
# and natively on as many CPUs as it was built on) unless it is here. These keep one: the agent
# page's (supabase and conduit on two CPUs, python-agent; the page has no machine without a kernel
# yet), conduit-1cpu (its image's Supabase CLI predates what runs with no kernel) and web (its dev
# server watches files with inotify, which armless's user mode doesn't have) and java (in the page,
# on one CPU with no kernel, jshell's Gson commands don't finish: to be found in armless's user mode)
# and bun (the agent and fleet pages run shell commands in it)
KERNEL = "conduit conduit-1cpu supabase python-agent web java bun"
# Examples built and checked in CI but not on the site (too big, or need the host's network, or
# being tried: bun-nokernel, to see Bun run in armless's user mode)
EXAMPLES = "apk bun-nokernel"

[tasks.build]
description = "Build every example into dist/<language>, then assemble the site"
run = '''
set -e
go build -o snowglobe ./cmd/snowglobe
rm -rf dist
for demo in $DEMOS; do
  src=${demo%-nokernel}; src=${src%-[0-9]cpu}; flags=""
  case "$demo" in *-[0-9]cpu) n=${demo##*-}; flags="--cpus ${n%cpu}" ;; esac
  # With no guest kernel unless KERNEL keeps one
  case " $KERNEL " in *" $demo "*) ;; *) flags="$flags --kernel none" ;; esac
  ./snowglobe build "examples/$src" --out "dist/$demo" $flags
done
mise run assemble
'''

# CI builds each demo in its own job, gathers them into dist/, and runs this same task, so the
# demos the site serves are assembled exactly as `mise run build` assembles them locally. The pages
# themselves aren't in dist/: site/server.exs renders them from site/templates
[tasks.assemble]
description = "Pool the blobs of the demos in dist/, make each an installable app, and list the agent page's machines"
run = '''
set -e
go build -o snowglobe ./cmd/snowglobe
./snowglobe pool dist
# Every demo is also an installable app that works offline once it has run
for demo in $DEMOS; do
  ./snowglobe pwa "dist/$demo"
done
# The agent page's machines (/agent/runtimes.json and its scripts), once the sites' pages are final
./snowglobe agent-pages dist
# The fleet page's example, and the templates in its menu: the repo's own fleet files, which the page loads
mkdir -p dist/fleet/templates && cp examples/fleet/snowglobe.toml dist/fleet/snowglobe.toml && cp examples/fleet/templates/*.toml dist/fleet/templates/
# A copy of xterm.js the index page renders the recorded transcripts with
cp -R dist/elixir/xterm dist/xterm
'''

# The site as Fly serves it (needs Elixir): its pages, site/static and the demos in dist/
[tasks.serve]
description = "Serve the site with the demos in dist/ at http://localhost:8000"
run = "PORT=8000 elixir site/server.exs dist"

[tasks.test]
description = "Run the tests"
run = "go test ./... && node --test examples/conduit/server.test.mjs internal/site/sessions.test.cjs internal/site/agent.test.cjs internal/site/machine.test.cjs internal/site/session-ui.test.cjs internal/site/scheduler.test.cjs internal/site/transfer.test.cjs internal/site/orchestrator.test.cjs internal/site/preview.test.cjs internal/site/builder.test.cjs internal/site/studio.test.cjs internal/site/fleet.test.cjs internal/site/memory-debug.test.cjs internal/site/apphost.test.mjs bench/lib.test.mjs bench/server.test.mjs"
