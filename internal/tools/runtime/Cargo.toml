[package]
name = "snowglobe-vm"
version = "0.1.0"
edition = "2021"
publish = false
description = "snowglobe's machine runtime: boots and snapshots a site's guest, and runs built sites (armless)"
license = "MIT"

[dependencies]
armless = { git = "https://github.com/filipecabaco/armless", rev = "a0e3a8b4e22f" }
armless-user = { git = "https://github.com/filipecabaco/armless", rev = "a0e3a8b4e22f" }
libc = "0.2"
regex = { version = "1", default-features = false, features = ["std", "perf"] }
serde_json = "1"
sha2 = "0.10"
zstd = { version = "0.13", default-features = false, features = ["zstdmt"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
