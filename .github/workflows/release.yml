name: Release

# A release is v<VERSION>: changing VERSION on main releases it (the tag is made here, once the
# checks pass, unless it exists already), and so does pushing a tag vX.Y.Z by hand (vX.Y.Z-rc.1 for
# a prerelease). Either way: the same tests and site checks as main (pages.yml, without touching
# the site), the tools image published to GHCR for amd64 and arm64 so `snowglobe build` pulls it
# instead of compiling snowglobe-vm, then the binaries on a GitHub release.
on:
  push:
    branches: [main]
    paths: [VERSION]
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Go's module proxy only treats semver tags as versions, and a release is cut from main
  # A push to main that changed VERSION to a version already tagged releases nothing (tag is empty)
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check the tag
        id: tag
        run: |
          version="v$(tr -d '[:space:]' < VERSION)"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            TAG=$GITHUB_REF_NAME
            [ "$TAG" = "$version" ] || echo "::warning::$TAG is released while VERSION says $version"
          else
            TAG=$version
            if git rev-parse -q --verify "refs/tags/$TAG" > /dev/null; then
              echo "$TAG is released already; nothing to do"
              exit 0
            fi
          fi
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::$TAG isn't vX.Y.Z or vX.Y.Z-pre"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$TAG isn't on main"; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  ci:
    needs: check
    if: needs.check.outputs.tag
    uses: ./.github/workflows/pages.yml
    with:
      release: true
    # What pages.yml declares; with release: true it pushes and deploys nothing
    permissions:
      contents: write
      pages: write
      id-token: write
      pull-requests: write

  # The tools image runs on the host's architecture: each is built on its own. It's named after
  # its sources (tools.Version), so a release that didn't change it finds it published already
  tools:
    needs: ci
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.build.outputs.image }}
      published: ${{ steps.build.outputs.published }}
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v5

      - name: Build the tools image, or find it published
        id: build
        run: |
          go build -o snowglobe ./cmd/snowglobe
          local=$(./snowglobe tools)
          image="ghcr.io/${GITHUB_REPOSITORY,,}-tools:${local#*:}"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          if docker buildx imagetools inspect "$image" > /dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "$image is published already"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            docker tag "$local" "$image-${{ matrix.arch }}"
          fi

      - name: Push ${{ matrix.arch }}
        if: steps.build.outputs.published != 'true'
        env:
          IMAGE: ${{ steps.build.outputs.image }}
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE-${{ matrix.arch }}"

  tools-manifest:
    needs: tools
    if: needs.tools.outputs.published != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      packages: write
    env:
      IMAGE: ${{ needs.tools.outputs.image }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Publish the amd64 + arm64 image
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker buildx imagetools create --tag "$IMAGE" "$IMAGE-amd64" "$IMAGE-arm64"
          docker buildx imagetools inspect "$IMAGE"

  # snowglobe-vm for macOS on Apple silicon (the only Mac supported): built here, on a Mac, before
  # the release, which puts it into that system's snowglobe (and publishes it for bundles)
  vm-darwin:
    needs: [check, ci]
    if: ${{ !failure() && !cancelled() && needs.check.outputs.tag }}
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Build snowglobe-vm
        working-directory: internal/tools/runtime
        run: |
          rustup toolchain install stable --profile minimal
          cargo build --release --locked
          strip target/release/snowglobe-vm
          ./target/release/snowglobe-vm sandbox-check
          mkdir -p ../../../vm/darwin_arm64
          cp target/release/snowglobe-vm ../../../vm/darwin_arm64/

      - uses: actions/upload-artifact@v7
        with:
          name: vm-darwin
          path: vm/
          retention-days: 1

  release:
    needs: [check, tools, tools-manifest, vm-darwin]
    # tools-manifest is skipped when the image was published already; vm-darwin may fail or never
    # get a runner, and the release goes out without the macOS snowglobe-vm
    if: >-
      ${{ always() && needs.check.outputs.tag && needs.check.result == 'success'
      && needs.tools.result == 'success'
      && (needs.tools-manifest.result == 'success' || needs.tools-manifest.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      TAG: ${{ needs.check.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v5

      # snowglobe-vm for Linux, so `snowglobe run` (and bundles) need no Docker there: the static
      # (musl) binary the tools image carries, for each architecture
      - name: snowglobe-vm for Linux, from the tools image
        env:
          IMAGE: ${{ needs.tools.outputs.image }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          mkdir -p release
          for arch in amd64 arm64; do
            id=$(docker create --platform "linux/$arch" "$IMAGE")
            mkdir -p "vm/linux_$arch" && docker cp "$id:/tools/snowglobe-vm" "vm/linux_$arch/snowglobe-vm" && docker rm "$id"
          done

      # macOS runners don't always start: without its snowglobe-vm the release still goes out, the
      # macOS snowglobe without one inside (it downloads the release's, which a Mac can attach after)
      - uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: vm-darwin
          path: vm/

      # Each system's snowglobe-vm as an asset of its own too: what `snowglobe bundle --target` puts
      # in a bundle for another system
      - name: snowglobe-vm assets
        run: |
          for dir in vm/*/; do
            target=$(basename "$dir")
            name="snowglobe-vm_${TAG#v}_${target}"
            mkdir -p "$name" && cp "$dir/snowglobe-vm" LICENSE.md "$name/" && chmod 755 "$name/snowglobe-vm"
            tar -czf "release/$name.tar.gz" "$name"
          done

      # The kernel archive builds without Docker add (snowglobe build --builder native): linux-virt,
      # its 9p initramfs and modules, built for arm64 (under QEMU here)
      - name: Kernel archive for builds without Docker
        run: |
          docker run --privileged --rm tonistiigi/binfmt --install arm64
          go build -o snowglobe-kernel ./cmd/snowglobe
          ./snowglobe-kernel tools kernel "release/snowglobe-boot_${TAG#v}_arm64.tar.gz"
          tar -tzf "release/snowglobe-boot_${TAG#v}_arm64.tar.gz" | grep -qx boot/vmlinuz-virt

      # One file each: every snowglobe carries its system's snowglobe-vm (zstd), unpacked into the
      # cache on first use, so running natively needs no download. Supported: Linux on x86-64 and
      # arm64, macOS on Apple silicon
      - name: Build the binaries
        run: |
          mkdir -p release
          for target in linux/amd64 linux/arm64 darwin/arm64; do
            os=${target%/*} arch=${target#*/}
            name="snowglobe_${TAG#v}_${os}_${arch}"
            mkdir -p "build/$name"
            tags=
            if [ -f "vm/${os}_${arch}/snowglobe-vm" ]; then
              zstd -19 -q -f "vm/${os}_${arch}/snowglobe-vm" -o internal/native/embedded/snowglobe-vm.zst
              tags=embedvm
            else
              echo "::warning::no snowglobe-vm for ${os}/${arch}: its snowglobe carries none"
            fi
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -tags "$tags" \
              -ldflags "-s -w -X main.version=$TAG" -o "build/$name/snowglobe" ./cmd/snowglobe
            cp LICENSE.md README.md "build/$name/"
            tar -czf "release/$name.tar.gz" -C build "$name"
          done
          (cd release && sha256sum -- *.tar.gz > SHA256SUMS)
          cat release/SHA256SUMS

      - name: Check the linux/amd64 binary
        run: |
          mkdir check && tar -xzf "release/snowglobe_${TAG#v}_linux_amd64.tar.gz" -C check
          bin="check/snowglobe_${TAG#v}_linux_amd64/snowglobe"
          got=$("$bin" version | head -1)
          [ "$got" = "snowglobe $TAG" ] || { echo "::error::got $got"; exit 1; }
          # It carries its snowglobe-vm, and that one runs here
          "$bin" version | grep -q "snowglobe-vm: built in" || { echo "::error::no snowglobe-vm built in"; exit 1; }
          HOME=$(mktemp -d) XDG_CACHE_HOME=$(mktemp -d) "$bin" vm sandbox-check

      # Released from a change to VERSION: the tag, annotated, on the commit that was checked. A tag
      # pushed with this workflow's token starts no other workflow, so it isn't released twice
      - name: Tag ${{ env.TAG }}
        if: github.ref_type != 'tag'
        env:
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          git tag -a "$TAG" -m "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"

      - name: Publish the release
        run: |
          prerelease=
          [[ "$TAG" == *-* ]] && prerelease=--prerelease
          gh release create "$TAG" --verify-tag --generate-notes --title "$TAG" $prerelease release/*

